name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Build project
        run: |
          echo "Building in: $(pwd)"
          ls -la
          make clean
          make

      - name: Run basic tests
        run: |
          echo "Running tests in: $(pwd)"
          ls -la lib/
          make test-basic