name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # TEMPORARY — PR #104 bootstrap fixed-point nondeterminism debugging.
  # Produces many bootstrap.tabc generations in one macOS job, groups them
  # by content hash, and diagnoses + uploads artifacts on any divergence.
  # Remove before merging the PR.
  bootstrap-stress:
    if: github.event_name != 'push'
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build project
        run: |
          make clean
          make

      - name: Generate 12 bootstrap.tabc samples
        run: |
          mkdir -p gens
          for i in 1 2 3 4 5 6; do
            echo "=== round $i A $(date +%H:%M:%S) ==="
            TA_DUMP_INTERNS="gens/A$i.inter" ./tinyactor build lib/bootstrap/driver.ta "gens/A$i.tabc"
            echo "=== round $i B $(date +%H:%M:%S) ==="
            TA_DUMP_INTERNS="gens/B$i.inter" ./tinyactor build lib/bootstrap/driver.ta "gens/B$i.tabc"
          done

      - name: Group samples by content
        run: |
          python3 - <<'PY'
          import hashlib, glob, sys
          groups = {}
          for path in sorted(glob.glob("gens/*.tabc")):
              h = hashlib.sha256(open(path, "rb").read()).hexdigest()[:16]
              groups.setdefault(h, []).append(path)
          for h, paths in sorted(groups.items(), key=lambda kv: -len(kv[1])):
              print(f"group {h}: {len(paths)} files: {paths}")
          if len(groups) > 1:
              paths = sorted(groups.items(), key=lambda kv: -len(kv[1]))
              ref, bad = paths[0][1][0], paths[-1][1][0]
              print(f"\nDIVERGENCE: comparing {ref} vs {bad}")
              sys.exit(1)
          PY

      - name: Diagnose divergence
        if: failure()
        run: |
          python3 - <<'PY'
          import hashlib, glob, subprocess, sys
          groups = {}
          for path in sorted(glob.glob("gens/*.tabc")):
              h = hashlib.sha256(open(path, "rb").read()).hexdigest()[:16]
              groups.setdefault(h, []).append(path)
          paths = sorted(groups.items(), key=lambda kv: -len(kv[1]))
          ref, bad = paths[0][1][0], paths[-1][1][0]
          rc = subprocess.run(["python3", "test/diagnose_tabc.py", ref, bad]).returncode
          sys.exit(rc)
          PY

      - name: Upload samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-samples
          path: gens/

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Build project
        run: |
          echo "Building in: $(pwd)"
          make clean
          make
          ls -la lib/
          ls -la tavm tinyactor

      - name: Bootstrap fixed-point gate
        run: make bootstrap-selfhost

      - name: Run single test
        run: bash test/run_basic_tests.sh

      - name: Install clang-format
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y clang-format
          elif [ "$RUNNER_OS" == "macOS" ]; then
            brew install clang-format
          fi
          clang-format --version

      - name: Check code formatting
        run: make fmt-check

      - name: Run full basic tests
        run: make test
