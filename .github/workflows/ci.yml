name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # Linux doubles as the coverage job: the suite runs exactly ONCE, under
  # the coverage-instrumented binary (tavm_cov) — the test verdict and the
  # coverage report come from the same execution, nothing re-runs.
  # `make coverage` = clean + COV build + parallel suite + llvm-cov report;
  # the same command reproduces it locally.
  test-coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM coverage tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm
                    llvm-profdata --version
          llvm-cov --version

      - name: Build + run full test suite (parallel) + coverage report
        # -j4 (not -j8): every test runs the 2-3x slower instrumented
        # binary; oversubscribing the runner starves the multi-threaded
        # GC tests past their 180s timeout. Parallelism propagates to the
        # suite via the make jobserver.
        run: make -j4 coverage

  # macOS runs the plain (uninstrumented) build: this is the gate that
  # exercises the release binaries and the plain module dlopen path.
  # The bootstrap fixed-point gate lives in `make test` (test-bootstrap) —
  # it used to be a separate CI step that re-ran the rebuild + cmp that
  # test-bootstrap already does, and "Run single test" re-ran test-basic;
  # both were removed as pure duplication.
  test:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build project
        run: make clean && make

      - name: Install clang-format
        run: |
          brew install clang-format
          clang-format --version

      - name: Check code formatting
        run: make fmt-check

      - name: Run full test suite (parallel)
        run: make -j8 test

  # Non-blocking (continue-on-error) per issue #107: surfaces benchmark
  # regressions in CI without gating merges. Flip to blocking once the
  # suite proves stable. run_benchmarks.sh exits 1 on any benchmark FAIL.
  benchmark:
    continue-on-error: true
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Build project
        run: |
          make clean
          make
          make tinyactor

      - name: Run benchmarks (non-blocking)
        run: make benchmark