name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Cancel superseded runs on the same PR instead of queueing full runs
# behind them (each run is ~10 min); pushes to main always run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Linux runs the C implementation coverage suite (`make coverage`) and
  # the TA function coverage check (`make coverage-ta`) as two PARALLEL
  # jobs: they are independent pipelines (each starts from its own build)
  # and used to run back-to-back in one ~11 min job, which dominated CI
  # wall time. `make coverage` = clean + COV build + parallel suite +
  # llvm-cov report; the same command reproduces it locally.
  coverage-c:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM coverage tools (only if missing)
        # GitHub ubuntu runners ship clang/llvm; the apt round-trip
        # (~40s: update + install) only runs when llvm-profdata is absent.
        run: |
          command -v llvm-profdata >/dev/null 2>&1 || {
            sudo apt-get update
            sudo apt-get install -y clang llvm
          }
          llvm-profdata --version
          llvm-cov --version

      - name: Install snapshot gate dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y guile-3.0

      - name: Check kernfuzz frozen snapshots
        run: make kernfuzz-snapshot-check

      - name: Build + run full test suite (parallel) + C coverage report
        # -j4 (not -j8): every test runs the 2-3x slower instrumented
        # binary; oversubscribing the runner starves the multi-threaded
        # GC tests past their 180s timeout. Parallelism propagates to the
        # suite via the make jobserver.
        run: make -j4 coverage

  kernfuzz-fast:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install kernfuzz dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y guile-3.0

      - name: Run kernfuzz fast ring
        run: make kernfuzz-fast

  coverage-ta:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run TA function coverage check
        # This runs the suite with an instrumented bootstrap compiler and
        # prints the function coverage summary alongside the test verdict.
        run: make coverage-ta

  # macOS runs the plain (uninstrumented) build: this is the gate that
  # exercises the release binaries and the plain module dlopen path.
  # The bootstrap fixed-point gate lives in `make test` (test-bootstrap) —
  # it used to be a separate CI step that re-ran the rebuild + cmp that
  # test-bootstrap already does, and "Run single test" re-ran test-basic;
    # both were removed as pure duplication.
  test:
    strategy:
      fail-fast: false # ubuntu 的 flaky 不该连坐取消 macos
      matrix:
        # ubuntu 也要跑：默认 VM 是 lisp 后，ubuntu 上的 lispvm 只在
        # coverage-ta 里被执行过，出错无法区分 coverage 环境与平台本身。
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Build project
        run: make clean && make

      - name: Install clang-format (macOS only)
        if: runner.os == 'macOS'
        run: |
          # Pin to llvm@18: brew stable jumped 18 -> 23 and the two versions
          # disagree on formatting, so the latest formula fails fmt-check on
          # code formatted with 18 (all PRs red since 2026-10-06).
                    brew install llvm@18
          echo "$(brew --prefix llvm@18)/bin" >> "$GITHUB_PATH"
          "$(brew --prefix llvm@18)/bin/clang-format" --version

      - name: Check code formatting
        if: runner.os == 'macOS'
        run: make fmt-check

      - name: Run full test suite (parallel)
        run: make -j8 test

    # lisp 双轨 gate：bridge（TA ast → lisp 管线 → lispvm 语义正/负例）+
  # corpus（test/basic 全量对拍：lispvm stdout == tinyactor stdout）。
  # 这是 lispvm 取代 tavam 的决策数据源（vm-demo/lisp/README.md），
  # 红了就不许切默认 VM。
  lisp-gate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build project
        run: make clean && make

      - name: Run lisp gate (bridge + corpus)
        run: make lisp-gate

  # Long-running correctness and resource gates are separate from the fast
  # platform suite. The 1M actor gate requires Linux /proc and the bootstrap
  # gate rebuilds the self-hosting compiler more than once.
  long-running:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build project
        run: make clean && make

      - name: Run bootstrap fixed-point gate
        run: make test-bootstrap

      - name: Run 1M actor steady-state RSS/CPU gate
        run: make test-1m-actor


      # Non-blocking (continue-on-error) per issue #107: surfaces benchmark
  # regressions in CI without gating merges. Flip to blocking once the
  # suite proves stable. run_benchmarks.sh exits 1 on any benchmark FAIL.
  benchmark:
    continue-on-error: true
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Build project
        run: |
          make clean
          make
          make tinyactor

      - name: Run benchmarks (non-blocking)
        run: make benchmark
