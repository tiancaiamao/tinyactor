name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Build project
        run: |
          echo "Building in: $(pwd)"
          make clean
          make
          ls -la lib/
          ls -la tavm tinyactor

      - name: Check code formatting
        run: |
          echo "Run format check"
          make fmt-check

      - name: Run full tests
        run: |
          make test || echo "Make test-basic exit code: $?"
