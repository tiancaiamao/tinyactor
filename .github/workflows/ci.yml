name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Build project
        run: |
          echo "Building in: $(pwd)"
          make clean
          make
          ls -la lib/
          ls -la tavm tinyactor

      - name: Bootstrap fixed-point gate
        run: make bootstrap-selfhost

      - name: Run single test
        run: bash test/run_basic_tests.sh

      - name: Install clang-format
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y clang-format
          elif [ "$RUNNER_OS" == "macOS" ]; then
            brew install clang-format
          fi
          clang-format --version

      - name: Check code formatting
        run: make fmt-check

            # The 8 test categories are independent and all run against the already
      # built binaries, so `-j8` runs them concurrently: wall time drops from
      # ~50s (sequential) to ~29s (bounded by the slowest category,
      # test-bootstrap). File artifacts are all $$-PID-unique and only
      # test-example really binds a network port, so parallel execution is
      # race-free. See test/ (SKIP_LIST + retry already absorb any port flake).
      - name: Run full test suite (parallel)
        run: make -j8 test

  # Non-blocking (continue-on-error) per issue #107: surfaces benchmark
  # regressions in CI without gating merges. Flip to blocking once the
  # suite proves stable. run_benchmarks.sh exits 1 on any benchmark FAIL.
  benchmark:
    continue-on-error: true
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Build project
        run: |
          make clean
          make
          make tinyactor

      - name: Run benchmarks (non-blocking)
        run: make benchmark
