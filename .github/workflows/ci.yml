name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Build project
        run: |
          echo "Building in: $(pwd)"
          make clean
          make
          ls -la lib/
          ls -la tavm tinyactor

      - name: Run single test
        run: |
          echo "Running single test in: $(pwd)"
          bash test/run_basic_tests.sh || echo "Test exit code: $?"

      - name: Run full basic tests
        run: make test-basic || echo "Make test-basic exit code: $?"