name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Build shared library
        run: |
          if [[ "$OSTYPE" == "darwin"* ]]; then
            make lib/http.dylib
          else
            make lib/http.so
          fi

      - name: Run tests
        run: make test