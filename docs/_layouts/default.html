<!DOCTYPE html>
<html lang="{{ page.lang | default: 'zh' }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ site.description }}">
<style>
:root { --fg:#1a1a1a; --bg:#ffffff; --accent:#0b5cad; --muted:#666; --border:#e3e3e3; }
* { box-sizing: border-box; }
body { margin:0; font:16px/1.7 -apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif; color:var(--fg); background:var(--bg); }
header.site { border-bottom:1px solid var(--border); background:#fafafa; }
header.site .wrap { max-width:820px; margin:0 auto; padding:14px 20px; display:flex; align-items:baseline; gap:14px; }
header.site a { color:inherit; text-decoration:none; font-weight:600; }
header.site .lang { margin-left:auto; font-size:14px; }
main { max-width:820px; margin:0 auto; padding:8px 20px 40px; }
h1 { font-size:2rem; line-height:1.3; }
h2 { margin-top:2rem; border-bottom:1px solid var(--border); padding-bottom:.3rem; }
a { color:var(--accent); }
code, pre { font-family:"SF Mono",Menlo,Consolas,monospace; font-size:.9em; }
code { background:#f4f4f4; padding:.1em .3em; border-radius:3px; }
pre { background:#f7f7f7; border:1px solid var(--border); border-radius:6px; padding:12px 16px; overflow-x:auto; }
pre code { background:none; padding:0; }
table { border-collapse:collapse; width:100%; }
th, td { border:1px solid var(--border); padding:6px 10px; text-align:left; }
footer { border-top:1px solid var(--border); color:var(--muted); font-size:14px; }
footer .wrap { max-width:820px; margin:0 auto; padding:12px 20px; }
</style>
</head>
<body>
<header class="site">
  <div class="wrap">
    <a href="{{ site.baseurl }}/">{{ site.title }}</a>
    <span class="lang">
      {% if page.lang == 'en' %}<a href="{{ site.baseurl }}/">中文</a> · <strong>English</strong>
      {% else %}<strong>中文</strong> · <a href="{{ site.baseurl }}/index-en.html">English</a>{% endif %}
    </span>
  </div>
</header>
<main>
{{ content }}
</main>
<footer>
  <div class="wrap">
    TinyActor · <a href="https://github.com/tiancaiamao/tinyactor">GitHub</a> ·
    纯静态站点，无 JS / 无外部 CDN
  </div>
</footer>
</body>
</html>
